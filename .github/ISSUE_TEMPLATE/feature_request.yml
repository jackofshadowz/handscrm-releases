name: I want it to do something else
description: A job you wish you could hand over.
labels: [idea]
body:
  - type: textarea
    id: job
    attributes:
      label: The job
      description: Describe it the way you would describe it to a new hire, not as a feature.
      placeholder: "Every Monday, read the week's invoices and chase anything over 30 days."
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Including how long it takes, if you know.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
